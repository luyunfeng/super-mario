<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <meta name="robots" content="noindex, nofollow, noarchive">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; connect-src 'self'; base-uri 'none'; form-action 'none'">
  <title>对话摘录 · Super Mario</title>
  <link rel="stylesheet" href="/css/base.css">
  <style>
    main { max-width: 48rem; margin: 0 auto; padding: clamp(2rem, 8vw, 5rem) 1.25rem; }
    header { padding-bottom: 1rem; border-bottom: 2px solid var(--text); margin-bottom: 1.5rem; }
    h1 { font-size: clamp(1.6rem, 4vw, 2.2rem); }
    time { display: block; margin-top: .5rem; color: var(--text-2); }
    li { padding: 1.25rem; margin: 0 0 1rem; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); }
    li h2 { margin-bottom: .5rem; color: var(--text-2); }
    li p { white-space: pre-wrap; overflow-wrap: anywhere; }
  </style>
  <script type="module" src="/js/share.js"></script>
</head>
<body>
  <main>
    <header><h1>对话摘录</h1><time hidden></time></header>
    <p role="status">正在读取摘录…</p>
    <button type="button" hidden>重新读取摘录</button>
    <ol aria-label="分享的消息"></ol>
    <noscript>请启用 JavaScript 以读取摘录。</noscript>
  </main>
</body>
</html>
