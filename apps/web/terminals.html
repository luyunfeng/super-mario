<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Super Mario · Herdr 完整终端与文件工作区</title>
  <link rel="stylesheet" href="/vendor/xterm.css" />
  <style>
    :root {
      --bg: #FAF9F5;
      --surface: #FFFFFF;
      --surface-2: #F0EEE6;
      --border: #D9D6CC;
      --border-hi: #B8B4A7;
      --text: #1A1A18;
      --text-2: #55544E;
      --muted: #87867F;
      --accent: #D97757;
      --green: #16A34A;
      --amber: #D97706;
      --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
      --sans: system-ui, -apple-system, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; height: 100%; background: var(--bg); color: var(--text); font-family: var(--sans); font-size: 13px; overflow: hidden; }
    .app { display: grid; grid-template-rows: 46px minmax(0, 1fr); height: 100vh; }

    /* Clean light topbar matching the screenshots */
    .topbar {
      display: flex; align-items: center; justify-content: space-between; gap: 10px;
      padding: 0 14px; background: var(--surface); border-bottom: 1px solid var(--border);
    }
    .top-left { display: flex; align-items: center; gap: 10px; min-width: 0; }
    .seg {
      display: inline-flex; background: var(--surface-2); border: 1px solid var(--border);
      border-radius: 8px; padding: 2px; gap: 2px;
    }
    .seg button {
      border: 0; background: transparent; color: var(--text-2); padding: 4px 10px;
      border-radius: 6px; font-size: 12px; cursor: pointer; font-weight: 500;
    }
    .seg button.active { background: var(--surface); color: var(--text); box-shadow: 0 1px 2px rgba(0,0,0,0.08); font-weight: 600; }
    .title-wrap { min-width: 0; display: flex; flex-direction: column; }
    .title-main { font-weight: 600; font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 360px; }
    .title-sub { font-family: var(--mono); font-size: 11px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

    .top-right { display: flex; align-items: center; gap: 7px; flex-wrap: nowrap; }
    .status-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--green); display: inline-block; }
    .status-dot.off { background: var(--amber); }
    .conn-pill { display: inline-flex; align-items: center; gap: 5px; font-size: 12px; color: var(--text-2); padding: 0 6px; }

    .btn {
      display: inline-flex; align-items: center; gap: 5px; padding: 5px 10px;
      border-radius: 7px; border: 1px solid var(--border); background: var(--surface);
      color: var(--text-2); font-size: 12px; cursor: pointer; text-decoration: none;
      white-space: nowrap; transition: all 0.14s ease;
    }
    .btn:hover { border-color: var(--border-hi); color: var(--text); background: var(--surface-2); }
    .btn.active { background: var(--text); border-color: var(--text); color: #fff; }
    .btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 600; }
    .btn.ctrl-on { background: #FEF3C7; border-color: var(--amber); color: #92400E; font-weight: 600; }

    /* Body split: optional left pane list + center terminal + optional right file tree */
    .body { display: flex; min-height: 0; height: 100%; overflow: hidden; }

    .pane-sidebar {
      width: 248px; flex-shrink: 0; background: var(--surface); border-right: 1px solid var(--border);
      display: flex; flex-direction: column; min-height: 0;
    }
    .pane-sidebar[hidden] { display: none; }
    .side-pad { padding: 8px 10px; border-bottom: 1px solid var(--border); }
    .input {
      width: 100%; background: var(--bg); border: 1px solid var(--border); border-radius: 6px;
      color: var(--text); padding: 5px 8px; font-size: 12px;
    }
    .side-scroll { flex: 1; overflow-y: auto; padding: 8px; display: flex; flex-direction: column; gap: 5px; }
    .pane-card {
      border: 1px solid var(--border); border-radius: 8px; padding: 7px 9px; cursor: pointer; background: var(--bg);
    }
    .pane-card:hover { border-color: var(--border-hi); }
    .pane-card.active { border-color: var(--accent); background: #FFF5F0; }
    .pane-card-title { font-weight: 600; font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .pane-card-meta { font-family: var(--mono); font-size: 10.5px; color: var(--muted); margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

    /* Center terminal stage */
    .center { flex: 1; min-width: 0; display: flex; flex-direction: column; background: #FFFFFF; }
    .term-wrap { flex: 1; min-height: 0; position: relative; overflow: hidden; background: #FAF9F5; padding: 4px; }
    .term-wrap.dark { background: #111317; }
    #full-term, #single-term { width: 100%; height: 100%; }
    .multi-grid {
      width: 100%; height: 100%; display: grid; gap: 8px; padding: 6px;
      grid-template-columns: repeat(2, minmax(0, 1fr)); grid-auto-rows: minmax(0, 1fr);
    }
    .multi-tile {
      border: 1px solid var(--border); border-radius: 8px; overflow: hidden;
      display: grid; grid-template-rows: 32px minmax(0, 1fr); background: #FAF9F5;
    }
    .multi-tile-hdr {
      display: flex; align-items: center; justify-content: space-between; padding: 0 8px;
      background: var(--surface); border-bottom: 1px solid var(--border); font-size: 11.5px;
    }

    /* Quick send bar at bottom */
    .cmd-bar {
      display: flex; align-items: center; gap: 6px; padding: 7px 10px;
      background: var(--surface); border-top: 1px solid var(--border);
    }
    .cmd-bar input {
      flex: 1; min-width: 0; background: var(--bg); border: 1px solid var(--border);
      border-radius: 7px; padding: 6px 10px; font-size: 12.5px; color: var(--text);
    }
    .cmd-bar input:focus { outline: none; border-color: var(--accent); }

    /* Right File & Git Sidebar (matching screenshot 2) */
    .files-sidebar {
      width: 410px; max-width: 48vw; flex-shrink: 0;
      background: var(--surface); border-left: 1px solid var(--border);
      display: flex; flex-direction: column; min-height: 0;
    }
    .files-sidebar[hidden] { display: none; }
    .files-hdr {
      display: flex; align-items: center; justify-content: space-between; gap: 8px;
      padding: 9px 12px; border-bottom: 1px solid var(--border);
    }
    .files-path { font-family: var(--mono); font-size: 11.5px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .files-body { flex: 1; min-height: 0; display: flex; flex-direction: column; overflow: hidden; }
    .tree-list { flex: 1; overflow-y: auto; padding: 6px 8px; }
    .tree-row {
      display: flex; align-items: center; gap: 7px; padding: 5px 8px; border-radius: 6px;
      cursor: pointer; font-size: 12.5px; color: var(--text); user-select: none;
    }
    .tree-row:hover { background: var(--surface-2); }
    .tree-row.active { background: #FFF0E8; color: #9A4123; font-weight: 600; }
    .file-viewer {
      flex: 1; min-height: 0; display: flex; flex-direction: column; border-top: 1px solid var(--border); background: var(--bg);
    }
    .file-viewer-hdr {
      display: flex; align-items: center; justify-content: space-between; padding: 6px 10px;
      background: var(--surface-2); border-bottom: 1px solid var(--border); font-family: var(--mono); font-size: 11.5px;
    }
    .file-pre {
      margin: 0; flex: 1; overflow: auto; padding: 10px 12px;
      font-family: var(--mono); font-size: 11.5px; line-height: 1.5; white-space: pre; color: var(--text);
    }

    .auth-overlay {
      position: fixed; inset: 0; background: rgba(20, 20, 19, 0.55); z-index: 50;
      display: flex; align-items: center; justify-content: center;
    }
    .auth-card {
      background: var(--surface); border: 1px solid var(--border); border-radius: 12px;
      padding: 20px; width: min(360px, 92vw); display: flex; flex-direction: column; gap: 10px;
    }
  </style>
</head>
<body>
  <div class="app">
    <header class="topbar">
      <div class="top-left">
        <div class="seg" id="mode-seg">
          <button data-mode="single" type="button">单窗格</button>
          <button data-mode="full" class="active" type="button">完整界面</button>
          <button data-mode="multi" type="button">多屏</button>
        </div>
        <div class="title-wrap">
          <div class="title-main" id="top-title">正在连接 Herdr 完整客户端…</div>
          <div class="title-sub" id="top-sub">本地与 Web 多端同时在线</div>
        </div>
      </div>
      <div class="top-right">
        <span class="conn-pill"><span class="status-dot" id="conn-dot"></span><span id="conn-text">连接中</span></span>
        <button class="btn" id="btn-control" type="button" hidden>接管输入</button>
        <button class="btn" id="btn-theme" type="button" title="切换终端明暗主题">🌓</button>
        <button class="btn active" id="btn-files" type="button">📁 文件</button>
        <button class="btn" id="btn-refresh" type="button">↻</button>
        <a class="btn" href="/#projects/all/runs">← 工作台</a>
      </div>
    </header>

    <div class="body">
      <aside class="pane-sidebar" id="pane-sidebar" hidden>
        <div class="side-pad">
          <input class="input" id="pane-filter" type="search" placeholder="筛选终端 / 目录 / Agent…" />
        </div>
        <div class="side-scroll" id="pane-list"></div>
      </aside>

      <main class="center">
        <div class="term-wrap" id="term-wrap">
          <div id="full-term"></div>
          <div id="single-term" hidden></div>
          <div id="multi-grid" class="multi-grid" hidden></div>
        </div>
        <form class="cmd-bar" id="cmd-form">
          <input id="cmd-input" type="text" placeholder="输入中文或指令直接发给当前终端（回车发送；完整界面下也可直接在上方敲键盘/点击）…" />
          <button class="btn" id="btn-ctrlc" type="button">Ctrl+C</button>
          <button class="btn primary" type="submit">发送</button>
        </form>
      </main>

      <aside class="files-sidebar" id="files-sidebar">
        <div class="files-hdr">
          <div style="min-width:0;">
            <strong style="font-size:13px;">文件</strong>
            <div class="files-path" id="files-root">等待定位目录…</div>
          </div>
          <div style="display:flex;gap:5px;">
            <button class="btn" id="btn-file-up" type="button" title="返回上一级">↑</button>
            <button class="btn" id="btn-git-diff" type="button">Git</button>
          </div>
        </div>
        <div class="files-body">
          <div class="tree-list" id="tree-list"></div>
          <div class="file-viewer" id="file-viewer" hidden>
            <div class="file-viewer-hdr">
              <span id="viewer-name"></span>
              <div style="display:flex;gap:5px;">
                <button class="btn" id="viewer-mode" type="button" style="padding:2px 7px;font-size:11px;">看 Diff</button>
                <button class="btn" id="viewer-close" type="button" style="padding:2px 7px;font-size:11px;">✕</button>
              </div>
            </div>
            <pre class="file-pre" id="viewer-pre"></pre>
          </div>
        </div>
      </aside>
    </div>
  </div>

  <div class="auth-overlay" id="auth-overlay" hidden>
    <div class="auth-card">
      <strong>需要工作台访问令牌</strong>
      <input class="input" id="token-input" type="password" placeholder="输入 SUPER_MARIO_TOKEN" />
      <button class="btn primary" id="token-save" type="button">连接</button>
    </div>
  </div>

  <script src="/vendor/xterm.js"></script>
  <script>
    const enc = text => btoa(Array.from(new TextEncoder().encode(text), b => String.fromCharCode(b)).join(''));
    const dec = b64 => new TextDecoder().decode(Uint8Array.from(atob(b64), c => c.charCodeAt(0)));
    const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    const qs = new URLSearchParams(location.search);
    const filterProjectId = qs.get('projectId') || '';

    const LIGHT_THEME = { background: '#FAF9F5', foreground: '#1C1C1A', cursor: '#D97757', selectionBackground: '#E8DDD3' };
    const DARK_THEME = { background: '#111317', foreground: '#E6EDF3', cursor: '#D97757', selectionBackground: '#2A3142' };

    function getToken() {
      const fromUrl = qs.get('token') || new URLSearchParams(location.hash.replace(/^#/, '')).get('token');
      if (fromUrl) return fromUrl;
      try {
        const saved = JSON.parse(localStorage.getItem('super-mario-token') || 'null');
        if (saved?.value && (!saved.expiresAt || saved.expiresAt > Date.now())) return saved.value;
      } catch {}
      return '';
    }

    async function api(method, path, body) {
      const token = getToken();
      const res = await fetch('/api/v1' + path, {
        method,
        headers: { ...(token ? { Authorization: 'Bearer ' + token } : {}), ...(body ? { 'content-type': 'application/json' } : {}) },
        ...(body ? { body: JSON.stringify(body) } : {}),
      });
      if (res.status === 401) { document.getElementById('auth-overlay').hidden = false; throw new Error('unauthorized'); }
      document.getElementById('auth-overlay').hidden = true;
      const data = await res.json().catch(() => ({}));
      if (!res.ok) throw new Error(data.error || '请求失败');
      return data;
    }
    const callMachine = (machineId, method, params) => api('POST', `/machines/${encodeURIComponent(machineId)}/call`, { method, params });
    const readMachineCode = (machineId, cwd, kind, path = '') => api('GET', `/machines/${encodeURIComponent(machineId)}/code?cwd=${encodeURIComponent(cwd)}&kind=${encodeURIComponent(kind)}&path=${encodeURIComponent(path)}`);

    let mode = 'full';
    let dark = false;
    let machines = [];
    let activeMachine = null;
    let panes = [];
    let selectedPane = null;
    let currentProject = null;

    // Active leases
    let fullConn = null;   // { machineId, connectionId, term, timer, epoch }
    let singleConn = null; // { machineId, pane, connectionId, mode, term, timer, epoch }
    let multiConns = [];

    // File browser state
    let fileRootCwd = '';
    let fileRelPath = '';
    let selectedFile = '';
    let viewerShowingDiff = false;

    function setConnStatus(ok, text) {
      document.getElementById('conn-dot').classList.toggle('off', !ok);
      document.getElementById('conn-text').textContent = text;
    }

    function calcColsRows(container) {
      const rect = container.getBoundingClientRect();
      const cols = Math.max(40, Math.min(300, Math.floor((rect.width - 16) / 7.8)));
      const rows = Math.max(12, Math.min(120, Math.floor((rect.height - 16) / 17.5)));
      return { cols, rows };
    }

    async function releaseConn(conn) {
      if (!conn) return;
      conn.epoch++;
      clearTimeout(conn.timer);
      const id = conn.connectionId;
      conn.connectionId = null;
      if (id) { try { await callMachine(conn.machineId, 'terminal.live.release', { connectionId: id }); } catch {} }
      conn.term?.dispose();
    }

    async function stopAllModes() {
      await releaseConn(fullConn); fullConn = null;
      await releaseConn(singleConn); singleConn = null;
      for (const c of multiConns) await releaseConn(c);
      multiConns = [];
      document.getElementById('full-term').innerHTML = '';
      document.getElementById('single-term').innerHTML = '';
      document.getElementById('multi-grid').innerHTML = '';
    }

    async function startFullMode() {
      if (!activeMachine) { setConnStatus(false, '无在线执行机'); return; }
      const container = document.getElementById('full-term');
      container.innerHTML = '';
      const { cols, rows } = calcColsRows(container);
      const term = new window.Terminal({
        convertEol: false, cursorBlink: true, fontSize: 13, cols, rows,
        theme: dark ? DARK_THEME : LIGHT_THEME,
      });
      term.open(container);
      const conn = { machineId: activeMachine.id, connectionId: null, term, timer: null, epoch: 1, writes: Promise.resolve() };
      fullConn = conn;
      setConnStatus(false, '正在接入 Herdr 完整界面…');
      document.getElementById('top-title').textContent = `${activeMachine.name} · Herdr 完整界面`;
      document.getElementById('top-sub').textContent = fileRootCwd || '与本地客户端多端同步';

      try {
        const res = await callMachine(activeMachine.id, 'terminal.live.full.open', { cols, rows });
        if (fullConn !== conn) { await callMachine(activeMachine.id, 'terminal.live.release', { connectionId: res.connectionId }).catch(() => {}); return; }
        conn.connectionId = res.connectionId;
        setConnStatus(true, '已连接');
        term.focus();

        term.onData(data => {
          if (!conn.connectionId) return;
          conn.writes = conn.writes.then(() => callMachine(conn.machineId, 'terminal.live.input', { connectionId: conn.connectionId, data: enc(data) })).catch(() => {});
        });

        const poll = async (after = -1) => {
          if (fullConn !== conn || !conn.connectionId) return;
          try {
            const out = await callMachine(conn.machineId, 'terminal.live.frames', { connectionId: conn.connectionId, after });
            if (fullConn !== conn) return;
            let seq = after;
            for (const f of out.frames || []) { term.write(dec(f.data)); seq = f.seq; }
            conn.timer = setTimeout(() => poll(seq), 120);
          } catch (err) {
            if (fullConn === conn) setConnStatus(false, '已断开：' + err.message);
          }
        };
        void poll(-1);
      } catch (err) {
        setConnStatus(false, '接入失败');
        term.write(`\r\n无法启动 Herdr 完整界面：${err.message}\r\n可切换顶部「单窗格」模式继续使用。\r\n`);
      }
    }

    async function startSingleMode(pane, openMode = 'observe') {
      await releaseConn(singleConn); singleConn = null;
      if (!pane) { setConnStatus(false, '请选择左侧终端'); return; }
      selectedPane = pane;
      renderPaneList();
      const container = document.getElementById('single-term');
      container.innerHTML = '';
      const term = new window.Terminal({
        convertEol: false, cursorBlink: true, fontSize: 13,
        theme: dark ? DARK_THEME : LIGHT_THEME,
      });
      term.open(container);
      const conn = { machineId: pane.machineId, pane, connectionId: null, mode: openMode, term, timer: null, epoch: 1, writes: Promise.resolve() };
      singleConn = conn;
      document.getElementById('top-title').textContent = pane.title;
      document.getElementById('top-sub').textContent = `${pane.agent} · ${pane.machineName} · ${pane.cwd}`;
      updateControlButton();
      setConnStatus(false, openMode === 'control' ? '正在接管…' : '正在观察…');
      if (pane.cwd && pane.cwd !== fileRootCwd) { fileRootCwd = pane.cwd; fileRelPath = ''; void loadFileTree(); }

      try {
        const res = await callMachine(pane.machineId, 'terminal.live.open', { paneId: pane.paneId, terminalId: pane.terminalId, cwd: pane.cwd, mode: openMode });
        if (singleConn !== conn) { await callMachine(pane.machineId, 'terminal.live.release', { connectionId: res.connectionId }).catch(() => {}); return; }
        conn.connectionId = res.connectionId;
        setConnStatus(true, openMode === 'control' ? '已接管' : '已连接（只读）');
        updateControlButton();
        if (openMode === 'control') term.focus();

        term.onData(data => {
          if (conn.mode !== 'control' || !conn.connectionId) return;
          conn.writes = conn.writes.then(() => callMachine(conn.machineId, 'terminal.live.input', { connectionId: conn.connectionId, data: enc(data) })).catch(() => {});
        });

        const poll = async (after = -1) => {
          if (singleConn !== conn || !conn.connectionId) return;
          try {
            const out = await callMachine(conn.machineId, 'terminal.live.frames', { connectionId: conn.connectionId, after });
            if (singleConn !== conn) return;
            let seq = after;
            for (const f of out.frames || []) {
              if (f.width && f.height && (term.cols !== f.width || term.rows !== f.height)) term.resize(f.width, f.height);
              term.write(dec(f.data)); seq = f.seq;
            }
            conn.timer = setTimeout(() => poll(seq), 180);
          } catch (err) {
            if (singleConn === conn) setConnStatus(false, '已断开');
          }
        };
        void poll(-1);
      } catch (err) {
        setConnStatus(false, '接入失败');
        term.write(`\r\n无法连接终端：${err.message}\r\n`);
      }
    }

    async function startMultiMode() {
      const grid = document.getElementById('multi-grid');
      grid.innerHTML = '';
      const picks = panes.slice(0, 4);
      if (!picks.length) { grid.innerHTML = '<div style="padding:24px;color:var(--muted);">当前没有活终端</div>'; return; }
      setConnStatus(true, `多屏观察 (${picks.length})`);
      for (const pane of picks) {
        const tile = document.createElement('div');
        tile.className = 'multi-tile';
        tile.innerHTML = `<div class="multi-tile-hdr"><strong>${esc(pane.title)}</strong><button class="btn" style="padding:2px 7px;font-size:11px;">单屏接管</button></div><div style="min-height:0;overflow:auto;padding:4px;"></div>`;
        grid.append(tile);
        tile.querySelector('button').addEventListener('click', () => { selectedPane = pane; void switchMode('single'); });
        const term = new window.Terminal({ convertEol: false, fontSize: 11.5, theme: dark ? DARK_THEME : LIGHT_THEME });
        term.open(tile.lastElementChild);
        const conn = { machineId: pane.machineId, connectionId: null, term, timer: null, epoch: 1 };
        multiConns.push(conn);
        callMachine(pane.machineId, 'terminal.live.open', { paneId: pane.paneId, terminalId: pane.terminalId, cwd: pane.cwd, mode: 'observe' })
          .then(res => {
            conn.connectionId = res.connectionId;
            const poll = async (after = -1) => {
              if (!conn.connectionId) return;
              try {
                const out = await callMachine(conn.machineId, 'terminal.live.frames', { connectionId: conn.connectionId, after });
                let seq = after;
                for (const f of out.frames || []) {
                  if (f.width && f.height && (term.cols !== f.width || term.rows !== f.height)) term.resize(f.width, f.height);
                  term.write(dec(f.data)); seq = f.seq;
                }
                conn.timer = setTimeout(() => poll(seq), 280);
              } catch {}
            };
            void poll(-1);
          }).catch(err => term.write(`连接失败：${err.message}`));
      }
    }

    function updateControlButton() {
      const btn = document.getElementById('btn-control');
      btn.hidden = mode !== 'single' || !selectedPane;
      const isCtrl = singleConn?.mode === 'control';
      btn.textContent = isCtrl ? '停止接管' : '接管输入';
      btn.classList.toggle('ctrl-on', isCtrl);
    }

    async function switchMode(next) {
      mode = next;
      await stopAllModes();
      document.querySelectorAll('#mode-seg button').forEach(b => b.classList.toggle('active', b.dataset.mode === next));
      document.getElementById('pane-sidebar').hidden = next === 'full';
      document.getElementById('full-term').hidden = next !== 'full';
      document.getElementById('single-term').hidden = next !== 'single';
      document.getElementById('multi-grid').hidden = next !== 'multi';
      updateControlButton();
      if (next === 'full') await startFullMode();
      else if (next === 'single') await startSingleMode(selectedPane || panes[0], 'observe');
      else await startMultiMode();
    }

    function renderPaneList() {
      const q = (document.getElementById('pane-filter').value || '').trim().toLowerCase();
      const filtered = panes.filter(p => !q || `${p.title} ${p.cwd} ${p.agent}`.toLowerCase().includes(q));
      const list = document.getElementById('pane-list');
      list.innerHTML = filtered.map(p => `<div class="pane-card ${selectedPane?.terminalId === p.terminalId ? 'active' : ''}" data-tid="${esc(p.terminalId)}">
        <div class="pane-card-title">${esc(p.title)}</div>
        <div class="pane-card-meta">${esc(p.agent)} · ${esc(p.cwd.split('/').slice(-2).join('/'))}</div>
      </div>`).join('') || '<div style="padding:16px;color:var(--muted);text-align:center;">无匹配终端</div>';
      list.querySelectorAll('.pane-card').forEach(el => {
        el.addEventListener('click', () => {
          const target = panes.find(p => p.terminalId === el.dataset.tid);
          if (target) void startSingleMode(target, 'observe');
        });
      });
    }

    // —— Right File & Git Sidebar ——
    async function loadFileTree() {
      const listEl = document.getElementById('tree-list');
      if (!activeMachine || !fileRootCwd) {
        document.getElementById('files-root').textContent = '未定位目录';
        listEl.innerHTML = '<div style="padding:16px;color:var(--muted);">暂无可浏览的项目目录</div>';
        return;
      }
      document.getElementById('files-root').textContent = fileRelPath ? `${fileRootCwd}/${fileRelPath}` : fileRootCwd;
      try {
        const res = await readMachineCode(activeMachine.id, fileRootCwd, 'tree', fileRelPath);
        const entries = (res.entries || []).sort((a, b) => Number(b.directory) - Number(a.directory) || a.name.localeCompare(b.name));
        listEl.innerHTML = entries.map(e => `<div class="tree-row ${selectedFile === e.path ? 'active' : ''}" data-path="${esc(e.path)}" data-dir="${e.directory ? '1' : '0'}">
          <span>${e.directory ? '📁' : '📄'}</span><span>${esc(e.name)}</span>
        </div>`).join('') || '<div style="padding:14px;color:var(--muted);">空目录</div>';
        listEl.querySelectorAll('.tree-row').forEach(row => {
          row.addEventListener('click', () => {
            if (row.dataset.dir === '1') { fileRelPath = row.dataset.path; void loadFileTree(); }
            else { selectedFile = row.dataset.path; viewerShowingDiff = false; void openFileViewer(); }
          });
        });
      } catch (err) {
        listEl.innerHTML = `<div style="padding:14px;color:var(--muted);">读取目录失败：${esc(err.message)}</div>`;
      }
    }

    async function openFileViewer() {
      if (!activeMachine || !fileRootCwd || !selectedFile) return;
      const viewer = document.getElementById('file-viewer');
      viewer.hidden = false;
      document.getElementById('viewer-name').textContent = `${selectedFile}${viewerShowingDiff ? ' (Git Diff)' : ''}`;
      document.getElementById('viewer-mode').textContent = viewerShowingDiff ? '看源码' : '看 Diff';
      document.getElementById('viewer-pre').textContent = '读取中…';
      try {
        const res = await readMachineCode(activeMachine.id, fileRootCwd, viewerShowingDiff ? 'diff' : 'file', selectedFile);
        document.getElementById('viewer-pre').textContent = viewerShowingDiff ? (res.diff || '（相对 HEAD 无改动）') : (res.text || '');
      } catch (err) {
        document.getElementById('viewer-pre').textContent = `无法读取：${err.message}`;
      }
    }

    async function bootstrap() {
      try {
        const snap = await api('GET', '/snapshot');
        currentProject = filterProjectId ? (snap.projects || []).find(p => p.id === filterProjectId && !p.archivedAt) : null;
        machines = (snap.machines || []).filter(m => m.online);
        activeMachine = (currentProject?.workspace && machines.find(m => m.id === currentProject.workspace.machineId)) || machines[0] || null;
        if (activeMachine) {
          const res = await callMachine(activeMachine.id, 'terminal.live.list', currentProject?.workspace ? { cwd: currentProject.workspace.cwd } : {});
          panes = (res.panes || []).map(p => ({ ...p, machineId: activeMachine.id, machineName: activeMachine.name }));
          selectedPane = panes[0] || null;
          fileRootCwd = currentProject?.workspace?.cwd || selectedPane?.cwd || '';
        }
        renderPaneList();
        void loadFileTree();
        await switchMode(mode);
      } catch {}
    }

    // Events
    document.querySelectorAll('#mode-seg button').forEach(b => b.addEventListener('click', () => void switchMode(b.dataset.mode)));
    document.getElementById('pane-filter').addEventListener('input', renderPaneList);
    document.getElementById('btn-refresh').addEventListener('click', () => void bootstrap());
    document.getElementById('btn-files').addEventListener('click', (e) => {
      const sb = document.getElementById('files-sidebar');
      sb.hidden = !sb.hidden;
      e.target.classList.toggle('active', !sb.hidden);
      if (mode === 'full' && fullConn?.connectionId) triggerFullResize();
    });
    document.getElementById('btn-theme').addEventListener('click', () => {
      dark = !dark;
      document.getElementById('term-wrap').classList.toggle('dark', dark);
      const t = dark ? DARK_THEME : LIGHT_THEME;
      if (fullConn?.term) fullConn.term.options.theme = t;
      if (singleConn?.term) singleConn.term.options.theme = t;
      for (const c of multiConns) if (c.term) c.term.options.theme = t;
    });
    document.getElementById('btn-control').addEventListener('click', () => {
      if (!selectedPane) return;
      void startSingleMode(selectedPane, singleConn?.mode === 'control' ? 'observe' : 'control');
    });
    document.getElementById('btn-file-up').addEventListener('click', () => {
      if (!fileRelPath) return;
      const parts = fileRelPath.split('/'); parts.pop(); fileRelPath = parts.join('/');
      void loadFileTree();
    });
    document.getElementById('btn-git-diff').addEventListener('click', () => {
      if (!selectedFile) return;
      viewerShowingDiff = !viewerShowingDiff;
      void openFileViewer();
    });
    document.getElementById('viewer-mode').addEventListener('click', () => { viewerShowingDiff = !viewerShowingDiff; void openFileViewer(); });
    document.getElementById('viewer-close').addEventListener('click', () => { document.getElementById('file-viewer').hidden = true; });

    // Quick send bar works in both Full and Single modes
    async function sendRaw(str) {
      if (mode === 'full' && fullConn?.connectionId) {
        await callMachine(fullConn.machineId, 'terminal.live.input', { connectionId: fullConn.connectionId, data: enc(str) });
      } else if (mode === 'single' && selectedPane) {
        if (singleConn?.mode !== 'control') await startSingleMode(selectedPane, 'control');
        if (singleConn?.connectionId) await callMachine(singleConn.machineId, 'terminal.live.input', { connectionId: singleConn.connectionId, data: enc(str) });
      }
    }
    document.getElementById('cmd-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const input = document.getElementById('cmd-input');
      const text = input.value.trim();
      if (!text) return;
      await sendRaw(text + '\r');
      input.value = '';
    });
    document.getElementById('btn-ctrlc').addEventListener('click', () => void sendRaw('\x03'));

    let resizeTimer;
    function triggerFullResize() {
      clearTimeout(resizeTimer);
      resizeTimer = setTimeout(() => {
        if (mode !== 'full' || !fullConn?.connectionId) return;
        const { cols, rows } = calcColsRows(document.getElementById('full-term'));
        fullConn.term.resize(cols, rows);
        void callMachine(fullConn.machineId, 'terminal.live.resize', { connectionId: fullConn.connectionId, cols, rows }).catch(() => {});
      }, 150);
    }
    window.addEventListener('resize', triggerFullResize);
    window.addEventListener('beforeunload', () => { void stopAllModes(); });
    document.getElementById('token-save').addEventListener('click', () => {
      const val = document.getElementById('token-input').value.trim();
      if (!val) return;
      localStorage.setItem('super-mario-token', JSON.stringify({ value: val, expiresAt: Date.now() + 30 * 86400000 }));
      void bootstrap();
    });

    void bootstrap();
  </script>
</body>
</html>
