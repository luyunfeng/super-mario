<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Super Mario · Herdr 完整终端与文件工作区</title>
  <link rel="stylesheet" href="/vendor/xterm.css" />
  <style>
    :root {
      --bg: #FAF9F5;
      --surface: #FFFFFF;
      --surface-2: #F0EEE6;
      --border: #D9D6CC;
      --border-hi: #B8B4A7;
      --text: #1A1A18;
      --text-2: #55544E;
      --muted: #87867F;
      --accent: #D97757;
      --green: #16A34A;
      --amber: #D97706;
      --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
      --sans: system-ui, -apple-system, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    }
    [hidden] { display: none !important; }
    .xterm { text-spacing-trim: space-all; }
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; height: 100%; background: var(--bg); color: var(--text); font-family: var(--sans); font-size: 13px; overflow: hidden; }
    .app { display: grid; grid-template-rows: 46px minmax(0, 1fr); height: 100vh; }

    /* Clean light topbar matching the screenshots */
    .topbar {
      display: flex; align-items: center; justify-content: space-between; gap: 10px;
      padding: 0 14px; background: var(--surface); border-bottom: 1px solid var(--border);
    }
    .top-left { display: flex; align-items: center; gap: 10px; min-width: 0; }
    .seg {
      display: inline-flex; background: var(--surface-2); border: 1px solid var(--border);
      border-radius: 8px; padding: 2px; gap: 2px;
    }
    .seg button {
      border: 0; background: transparent; color: var(--text-2); padding: 4px 10px;
      border-radius: 6px; font-size: 12px; cursor: pointer; font-weight: 500;
    }
    .seg button.active { background: var(--surface); color: var(--text); box-shadow: 0 1px 2px rgba(0,0,0,0.08); font-weight: 600; }
    .title-wrap { min-width: 0; display: flex; flex-direction: column; }
    .title-main { font-weight: 600; font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 360px; }
    .title-sub { font-family: var(--mono); font-size: 11px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

    .top-right { display: flex; align-items: center; gap: 7px; flex-wrap: nowrap; }
    .status-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--green); display: inline-block; }
    .status-dot.off { background: var(--amber); }
    .conn-pill { display: inline-flex; align-items: center; gap: 5px; font-size: 12px; color: var(--text-2); padding: 0 6px; }

    .btn {
      display: inline-flex; align-items: center; gap: 5px; padding: 5px 10px;
      border-radius: 7px; border: 1px solid var(--border); background: var(--surface);
      color: var(--text-2); font-size: 12px; cursor: pointer; text-decoration: none;
      white-space: nowrap; transition: all 0.14s ease;
    }
    .btn:hover { border-color: var(--border-hi); color: var(--text); background: var(--surface-2); }
    .btn.active { background: var(--text); border-color: var(--text); color: #fff; }
    .btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 600; }
    .btn.ctrl-on { background: #FEF3C7; border-color: var(--amber); color: #92400E; font-weight: 600; }

    /* Body split: optional left pane list + center terminal + optional right file tree */
    .body { display: flex; min-height: 0; height: 100%; overflow: hidden; }

    .pane-sidebar {
      width: 248px; flex-shrink: 0; background: var(--surface); border-right: 1px solid var(--border);
      display: flex; flex-direction: column; min-height: 0;
    }
    .pane-sidebar[hidden] { display: none; }
    .side-pad { padding: 8px 10px; border-bottom: 1px solid var(--border); }
    .input {
      width: 100%; background: var(--bg); border: 1px solid var(--border); border-radius: 6px;
      color: var(--text); padding: 5px 8px; font-size: 12px;
    }
    .side-scroll { flex: 1; overflow-y: auto; padding: 8px; display: flex; flex-direction: column; gap: 5px; }
    .pane-card {
      border: 1px solid var(--border); border-radius: 8px; padding: 7px 9px; cursor: pointer; background: var(--bg);
    }
    .pane-card:hover { border-color: var(--border-hi); }
    .pane-card.active { border-color: var(--accent); background: #FFF5F0; }
    .pane-card-title { font-weight: 600; font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .pane-card-meta { font-family: var(--mono); font-size: 10.5px; color: var(--muted); margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

    /* Center terminal stage */
    .center { flex: 1; min-width: 0; display: flex; flex-direction: column; background: #FFFFFF; }
    .term-wrap { flex: 1; min-height: 0; position: relative; overflow: hidden; background: #FAF9F5; padding: 4px; }
    .term-wrap.dark { background: #111317; }
    #full-term, #single-term { width: 100%; height: 100%; }
    .multi-grid {
      width: 100%; height: 100%; display: grid; gap: 8px; padding: 6px;
      grid-template-columns: repeat(2, minmax(0, 1fr)); grid-auto-rows: minmax(0, 1fr);
    }
    .multi-tile {
      border: 1px solid var(--border); border-radius: 8px; overflow: hidden;
      display: grid; grid-template-rows: 32px minmax(0, 1fr); background: #FAF9F5;
    }
    .multi-tile-hdr {
      display: flex; align-items: center; justify-content: space-between; padding: 0 8px;
      background: var(--surface); border-bottom: 1px solid var(--border); font-size: 11.5px;
    }

    /* Quick send bar at bottom */
    .cmd-bar {
      display: flex; align-items: center; gap: 6px; padding: 7px 10px;
      background: var(--surface); border-top: 1px solid var(--border);
    }
    .cmd-bar input {
      flex: 1; min-width: 0; background: var(--bg); border: 1px solid var(--border);
      border-radius: 7px; padding: 6px 10px; font-size: 12.5px; color: var(--text);
    }
    .cmd-bar input:focus { outline: none; border-color: var(--accent); }

    /* Right File & Git Sidebar (matching screenshot 2) */
    .files-sidebar {
      width: 410px; max-width: 48vw; flex-shrink: 0;
      background: var(--surface); border-left: 1px solid var(--border);
      display: flex; flex-direction: column; min-height: 0;
    }
    .files-sidebar[hidden] { display: none; }
    .files-hdr {
      display: flex; align-items: center; justify-content: space-between; gap: 8px;
      padding: 9px 12px; border-bottom: 1px solid var(--border);
    }
    .files-path { font-family: var(--mono); font-size: 11.5px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .files-body { flex: 1; min-height: 0; display: flex; flex-direction: column; overflow: hidden; }
    .tree-list { flex: 1; overflow-y: auto; padding: 6px 8px; }
    .tree-row {
      display: flex; align-items: center; gap: 7px; padding: 5px 8px; border-radius: 6px;
      cursor: pointer; font-size: 12.5px; color: var(--text); user-select: none;
    }
    .tree-row:hover { background: var(--surface-2); }
    .tree-row.active { background: #FFF0E8; color: #9A4123; font-weight: 600; }
    .file-viewer {
      flex: 1; min-height: 0; display: flex; flex-direction: column; border-top: 1px solid var(--border); background: var(--bg);
    }
    .file-viewer-hdr {
      display: flex; align-items: center; justify-content: space-between; padding: 6px 10px;
      background: var(--surface-2); border-bottom: 1px solid var(--border); font-family: var(--mono); font-size: 11.5px;
    }
    .file-pre {
      margin: 0; flex: 1; overflow: auto; padding: 10px 12px;
      font-family: var(--mono); font-size: 11.5px; line-height: 1.5; white-space: pre; color: var(--text);
    }

    @media (max-width: 950px) {
      .app { grid-template-rows: auto minmax(0, 1fr); }
      .topbar, .top-left, .top-right { flex-wrap: wrap; }
      .topbar { padding: 6px; gap: 4px; }
      .pane-sidebar { width: min(200px, 30vw); }
      .files-sidebar { width: min(320px, 34vw); }
    }
    @media (max-width: 620px) {
      .title-wrap { max-width: 44vw; }
      .seg button, .btn { padding: 4px 6px; }
      .top-left, .top-right { gap: 4px; }
      .body { position: relative; }
      .files-sidebar { position: absolute; inset: 0 0 0 auto; width: 78vw; max-width: none; z-index: 2; }
      .multi-grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <div class="app">
    <header class="topbar">
      <div class="top-left">
        <div class="seg" id="mode-seg">
          <button data-mode="single" type="button">单窗格</button>
          <button data-mode="full" type="button">完整界面</button>
          <button data-mode="multi" class="active" type="button">多屏</button>
        </div>
        <select id="machine-select" aria-label="执行机" class="btn" hidden></select>
        <select id="session-select" aria-label="Herdr 会话" class="btn" hidden></select>
        <button class="btn" id="start-host" type="button" hidden>启动终端宿主</button>
        <div class="title-wrap">
          <div class="title-main" id="top-title">正在连接执行机…</div>
          <div class="title-sub" id="top-sub"></div>
        </div>
      </div>
      <div class="top-right">
        <span class="conn-pill"><span class="status-dot" id="conn-dot"></span><span id="conn-text">连接中</span></span>
        <button class="btn" id="btn-control" type="button" hidden>接管输入</button>
        <button class="btn" id="btn-takeover" type="button" title="自动任务接管与终端弹窗拦截">🤖 自动接管</button>
        <button class="btn" id="btn-theme" type="button" title="切换终端明暗主题">🌓</button>
        <button class="btn active" id="btn-files" type="button">📁 文件</button>
        <button class="btn" id="btn-refresh" type="button">↻</button>

      </div>
    </header>

    <div class="body">
      <aside class="pane-sidebar" id="pane-sidebar" hidden>
        <div class="side-pad">
          <input class="input" id="pane-filter" type="search" placeholder="筛选终端 / 目录 / Agent…" />
        </div>
        <div class="side-scroll" id="pane-list"></div>
      </aside>

      <main class="center">
        <div class="term-wrap" id="term-wrap">
          <div id="full-term"></div>
          <div id="single-term" hidden></div>
          <div id="multi-grid" class="multi-grid" hidden></div>
        </div>
        <form class="cmd-bar" id="cmd-form">
          <input id="cmd-input" type="text" placeholder="输入中文或指令直接发给当前终端（回车发送；完整界面下也可直接在上方敲键盘/点击）…" />
          <button class="btn" id="btn-ctrlc" type="button">Ctrl+C</button>
          <button class="btn primary" type="submit">发送</button>
        </form>
      </main>

      <aside class="files-sidebar" id="takeover-sidebar" hidden>
        <div class="files-hdr">
          <div>
            <strong style="font-size:13px;">🤖 自动接管</strong>
            <div class="files-path">已绑定项目的目录信任弹窗自动放行，其余弹窗可一键远程按键</div>
          </div>
          <button class="btn" id="btn-takeover-scan" type="button">立即扫描</button>
        </div>
        <div class="side-pad" style="display:flex;flex-direction:column;gap:6px;font-size:12px;">
          <label style="display:flex;align-items:center;gap:6px;cursor:pointer;"><input type="checkbox" id="chk-takeover-enabled" /> 启用后台自动巡检（15s）</label>
          <label style="display:flex;align-items:center;gap:6px;cursor:pointer;"><input type="checkbox" id="chk-takeover-trust" /> 自动放行已绑定项目的信任目录弹窗</label>
        </div>
        <div class="side-scroll" id="takeover-list"></div>
      </aside>

      <aside class="files-sidebar" id="files-sidebar">
        <div class="files-hdr">
          <div style="min-width:0;">
            <strong style="font-size:13px;">文件</strong>
            <div class="files-path" id="files-root">等待定位目录…</div>
          </div>
          <div style="display:flex;gap:5px;">
            <button class="btn" id="btn-file-up" type="button" title="返回上一级">↑</button>
            <button class="btn" id="btn-git-diff" type="button">Git</button>
          </div>
        </div>
        <div class="files-body">
          <div class="tree-list" id="tree-list"></div>
          <div class="file-viewer" id="file-viewer" hidden>
            <div class="file-viewer-hdr">
              <span id="viewer-name"></span>
              <div style="display:flex;gap:5px;">
                <button class="btn" id="viewer-mode" type="button" style="padding:2px 7px;font-size:11px;">看 Diff</button>
                <button class="btn" id="viewer-close" type="button" style="padding:2px 7px;font-size:11px;">✕</button>
              </div>
            </div>
            <pre class="file-pre" id="viewer-pre"></pre>
          </div>
        </div>
      </aside>
    </div>
  </div>

  <script src="/vendor/xterm.js"></script>
  <script type="module">
    import { createApi } from '/js/lib/api.js';
    const client = window.frameElement?.workbenchApi ?? createApi();
    const enc = text => btoa(Array.from(new TextEncoder().encode(text), b => String.fromCharCode(b)).join(''));
    const dec = b64 => Uint8Array.from(atob(b64), c => c.charCodeAt(0));
    const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    const qs = new URLSearchParams(location.search);
    const filterProjectId = qs.get('projectId') || '';

    const LIGHT_THEME = { background: '#FAF9F5', foreground: '#1C1C1A', cursor: '#D97757', selectionBackground: '#E8DDD3' };
    const DARK_THEME = { background: '#111317', foreground: '#E6EDF3', cursor: '#D97757', selectionBackground: '#2A3142' };

    const api = (method, path, body) => client(path, { method, body });
    const callMachine = (machineId, method, params) => api('POST', `/machines/${encodeURIComponent(machineId)}/call`, { method, params });
    const readMachineCode = (machineId, cwd, kind, path = '') => api('GET', `/machines/${encodeURIComponent(machineId)}/code?cwd=${encodeURIComponent(cwd)}&kind=${encodeURIComponent(kind)}&path=${encodeURIComponent(path)}`);

    let mode = 'multi';
    let selectedSession = '';
    let inventoryReady = false;
    let inventoryRevision = 0;
    let treeRevision = 0;
    let viewerRevision = 0;
    let dark = false;
    let machines = [];
    let activeMachine = null;
    let panes = [];
    let selectedPane = null;
    let currentProject = null;

    let fullConn = null;
    let singleConn = null;
    let multiConns = [];

    // File browser state
    let fileRootCwd = '';
    let fileRelPath = '';
    let selectedFile = '';
    let viewerShowingDiff = false;

    function setConnStatus(ok, text) {
      document.getElementById('conn-dot').classList.toggle('off', !ok);
      document.getElementById('conn-text').textContent = text;
    }

    function calcColsRows(container) {
      const rect = container.getBoundingClientRect();
      const cols = Math.max(40, Math.min(300, Math.floor((rect.width - 16) / 7.8)));
      const rows = Math.max(12, Math.min(120, Math.floor((rect.height - 16) / 17.5)));
      return { cols, rows };
    }

    function releaseConn(conn) {
      if (!conn) return;
      conn.ready = false;
      conn.ws.onmessage = null;
      conn.ws.onclose = null;
      conn.ws.close();
      conn.term.dispose();
    }

    function liveWsUrl(params) {
      const proto = location.protocol === 'https:' ? 'wss:' : 'ws:';
      const u = new URL(`${proto}//${location.host}/api/v1/live-terminal`);
      const token = client.token();
      if (token) u.searchParams.set('token', token);
      for (const [k, v] of Object.entries(params)) if (v !== undefined && v !== '') u.searchParams.set(k, String(v));
      return u.href;
    }

    function stopAllModes() {
      releaseConn(fullConn);
      releaseConn(singleConn);
      multiConns.forEach(releaseConn);
      fullConn = singleConn = null;
      multiConns = [];
      for (const id of ['full-term', 'single-term', 'multi-grid']) document.getElementById(id).replaceChildren();
      updateControlButton();
    }

    function updateMultiStatus() {
      const ready = multiConns.filter(conn => conn.ready).length;
      setConnStatus(ready === multiConns.length, '多屏观察 · 已连接 ' + ready + '/' + multiConns.length);
    }

    function connectTerminal(container, openMode, pane) {
      const full = openMode === 'full';
      const interactive = openMode !== 'observe';
      const { cols, rows } = calcColsRows(container);
      const term = new window.Terminal({
        convertEol: false, cursorBlink: interactive, disableStdin: !interactive,
        rightClickSelectsWord: false,
        fontSize: mode === 'multi' ? 11.5 : 13, cols, rows, theme: dark ? DARK_THEME : LIGHT_THEME,
      });
      term.open(container);
      const machineId = activeMachine.id;
      const ws = new WebSocket(liveWsUrl({ machineId, session: selectedSession, mode: openMode, cols, rows,
        paneId: pane?.paneId, terminalId: pane?.terminalId, cwd: pane?.cwd }));
      const conn = { ws, term, mode: openMode, ready: false, machineId, session: selectedSession };
      term.onData(data => {
        if (interactive && conn.ready && ws.readyState === WebSocket.OPEN) ws.send(JSON.stringify({ type: 'input', data: enc(data) }));
      });
      if (full) container.oncontextmenu = event => { if (!event.shiftKey) event.preventDefault(); };
      const disconnected = reason => {
        conn.ready = false;
        updateControlButton();
        if (mode === 'multi') updateMultiStatus();
        else setConnStatus(false, reason);
        term.writeln('\r\n[' + reason + ']');
      };
      let failure = '';
      ws.onmessage = ev => {
        let msg;
        try {
          msg = JSON.parse(ev.data);
        } catch {
          failure = '终端数据格式异常';
          disconnected(failure);
          return;
        }
        if (msg.type === 'ready') {
          conn.ready = true;
          conn.session = msg.session || conn.session;
          if (mode === 'multi') updateMultiStatus();
          else setConnStatus(true, interactive ? '已连接（可输入）' : '已连接（只读）');
          updateControlButton();
          if (interactive) term.focus();
          if (full) void syncFocus(conn);
        } else if (msg.type === 'frame') {
          try {
            if (!full && msg.width && msg.height && (term.cols !== msg.width || term.rows !== msg.height)) term.resize(msg.width, msg.height);
            if (!full && msg.full && conn.painted) term.write('\x1bc');
            term.write(dec(msg.data));
            conn.painted = true;
          } catch {
            failure = '终端画面解码失败';
            disconnected(failure);
          }
        } else if (msg.type === 'error') {
          failure = msg.message || '终端连接失败';
          disconnected(failure);
        }
      };
      ws.onclose = () => { if (!failure) disconnected('连接已关闭'); };
      return conn;
    }

    function startSingleMode(pane, openMode = 'observe') {
      releaseConn(singleConn);
      singleConn = null;
      if (!pane) { setConnStatus(false, '请选择左侧终端'); return; }
      selectedPane = pane;
      renderPaneList();
      const container = document.getElementById('single-term');
      container.replaceChildren();
      singleConn = connectTerminal(container, openMode, pane);
      document.getElementById('top-title').textContent = pane.title;
      document.getElementById('top-sub').textContent = pane.cwd;
      setRoot(pane.cwd);
      setConnStatus(false, openMode === 'control' ? '正在接管…' : '正在观察…');
      updateControlButton();
    }

    function startMultiMode() {
      const grid = document.getElementById('multi-grid');
      const picks = panes.slice(0, 4);
      document.getElementById('top-title').textContent = activeMachine.name;
      document.getElementById('top-sub').textContent = selectedSession;
      setRoot(currentProject?.workspace?.cwd || selectedPane?.cwd || '');
      if (!picks.length) { setConnStatus(false, '当前没有活终端'); return; }
      setConnStatus(false, '多屏观察 · ' + picks.length + ' 个窗格');
      for (const pane of picks) {
        const tile = document.createElement('div');
        tile.className = 'multi-tile';
        tile.innerHTML = `<div class="multi-tile-hdr"><strong>${esc(pane.title)}</strong><button class="btn">单独查看</button></div><div style="min-height:0;overflow:auto;padding:4px;"></div>`;
        grid.append(tile);
        tile.querySelector('button').addEventListener('click', () => { selectedPane = pane; switchMode('single'); });
        multiConns.push(connectTerminal(tile.lastElementChild, 'observe', pane));
      }
    }

    function updateControlButton() {
      const btn = document.getElementById('btn-control');
      btn.hidden = mode !== 'single' || !selectedPane;
      const isCtrl = singleConn?.mode === 'control';
      btn.textContent = isCtrl ? '停止接管' : '接管输入';
      btn.classList.toggle('ctrl-on', isCtrl);
      const writable = mode === 'single' ? isCtrl && singleConn.ready : mode === 'full' && fullConn?.ready;
      for (const field of document.getElementById('cmd-form').elements) field.disabled = !writable;
    }

    function switchMode(next) {
      mode = next;
      stopAllModes();
      document.querySelectorAll('#mode-seg button').forEach(b => b.classList.toggle('active', b.dataset.mode === next));
      document.getElementById('pane-sidebar').hidden = next === 'multi';
      document.getElementById('full-term').hidden = next !== 'full';
      document.getElementById('single-term').hidden = next !== 'single';
      document.getElementById('multi-grid').hidden = next !== 'multi';
      document.getElementById('cmd-form').hidden = next === 'multi';
      if (!activeMachine || !inventoryReady) return;
      if (next === 'full') {
        setConnStatus(false, '正在连接…');
        document.getElementById('top-title').textContent = activeMachine.name + ' · ' + selectedSession;
        document.getElementById('top-sub').textContent = '';
        setRoot('');
        fullConn = connectTerminal(document.getElementById('full-term'), 'full');
      } else if (next === 'single') startSingleMode(selectedPane || panes[0]);
      else startMultiMode();
    }

    function renderPaneList() {
      const q = (document.getElementById('pane-filter').value || '').trim().toLowerCase();
      const filtered = panes.filter(p => !q || `${p.title} ${p.cwd} ${p.agent}`.toLowerCase().includes(q));
      const list = document.getElementById('pane-list');
      list.innerHTML = filtered.map(p => `<div class="pane-card ${selectedPane?.terminalId === p.terminalId ? 'active' : ''}" data-tid="${esc(p.terminalId)}">
        <div class="pane-card-title">${esc(p.title)}</div>
        <div class="pane-card-meta">${esc(p.agent)} · ${esc(p.cwd.split('/').slice(-2).join('/'))}</div>
      </div>`).join('') || '<div style="padding:16px;color:var(--muted);text-align:center;">无匹配终端</div>';
      list.querySelectorAll('.pane-card').forEach(el => {
        el.addEventListener('click', () => {
          const target = panes.find(p => p.terminalId === el.dataset.tid);
          if (!target) return;
          if (mode === 'full') {
            const conn = fullConn;
            if (!conn?.ready || !activeMachine.capabilities.includes('terminal.live.focus')) return;
            callMachine(conn.machineId, 'terminal.live.focus', {
              ...(conn.session ? { session: conn.session } : {}), paneId: target.paneId, terminalId: target.terminalId, cwd: target.cwd,
            }).then(() => { if (fullConn === conn) void syncFocus(conn); }).catch(error => {
              if (fullConn === conn) document.getElementById('top-sub').textContent = error.message;
            });
          } else { selectedPane = target; switchMode('single'); }
        });
      });
    }

    // —— Right File & Git Sidebar ——
    function setRoot(cwd) {
      if (fileRootCwd === cwd) return;
      fileRootCwd = cwd;
      fileRelPath = selectedFile = '';
      viewerRevision++;
      document.getElementById('file-viewer').hidden = true;
      void loadFileTree();
    }

    async function loadFileTree() {
      const revision = ++treeRevision;
      const listEl = document.getElementById('tree-list');
      if (!activeMachine || !fileRootCwd) {
        document.getElementById('files-root').textContent = '未定位目录';
        listEl.innerHTML = '<div style="padding:16px;color:var(--muted);">暂无可浏览的项目目录</div>';
        return;
      }
      document.getElementById('files-root').textContent = fileRelPath ? `${fileRootCwd}/${fileRelPath}` : fileRootCwd;
      try {
        const res = await readMachineCode(activeMachine.id, fileRootCwd, 'tree', fileRelPath);
        if (revision !== treeRevision) return;
        const entries = (res.entries || []).sort((a, b) => Number(b.directory) - Number(a.directory) || a.name.localeCompare(b.name));
        listEl.innerHTML = entries.map(e => `<div class="tree-row ${selectedFile === e.path ? 'active' : ''}" data-path="${esc(e.path)}" data-dir="${e.directory ? '1' : '0'}">
          <span>${e.directory ? '📁' : '📄'}</span><span>${esc(e.name)}</span>
        </div>`).join('') || '<div style="padding:14px;color:var(--muted);">空目录</div>';
        listEl.querySelectorAll('.tree-row').forEach(row => {
          row.addEventListener('click', () => {
            if (row.dataset.dir === '1') { fileRelPath = row.dataset.path; void loadFileTree(); }
            else { selectedFile = row.dataset.path; viewerShowingDiff = false; void openFileViewer(); }
          });
        });
      } catch (err) {
        if (revision !== treeRevision) return;
        listEl.innerHTML = `<div style="padding:14px;color:var(--muted);">读取目录失败：${esc(err.message)}</div>`;
      }
    }

    async function openFileViewer() {
      if (!activeMachine || !fileRootCwd || !selectedFile) return;
      const revision = ++viewerRevision;
      const viewer = document.getElementById('file-viewer');
      viewer.hidden = false;
      document.getElementById('viewer-name').textContent = `${selectedFile}${viewerShowingDiff ? ' (Git Diff)' : ''}`;
      document.getElementById('viewer-mode').textContent = viewerShowingDiff ? '看源码' : '看 Diff';
      document.getElementById('viewer-pre').textContent = '读取中…';
      try {
        const res = await readMachineCode(activeMachine.id, fileRootCwd, viewerShowingDiff ? 'diff' : 'file', selectedFile);
        if (revision !== viewerRevision) return;
        document.getElementById('viewer-pre').textContent = viewerShowingDiff ? (res.text || '（相对 HEAD 无改动）') : (res.text || '');
      } catch (err) {
        if (revision !== viewerRevision) return;
        document.getElementById('viewer-pre').textContent = `无法读取：${err.message}`;
      }
    }

    const machineSelect = document.getElementById('machine-select');
    const sessionSelect = document.getElementById('session-select');
    const startHost = document.getElementById('start-host');

    async function loadMachine(machine, preferredSession = '') {
      const revision = ++inventoryRevision;
      stopAllModes();
      activeMachine = machine;
      selectedSession = '';
      inventoryReady = false;
      selectedPane = null;
      panes = [];
      renderPaneList();
      setRoot('');
      sessionSelect.replaceChildren();
      sessionSelect.hidden = true;
      startHost.hidden = true;
      document.getElementById('top-title').textContent = machine?.name || '无在线执行机';
      document.getElementById('top-sub').textContent = '';
      if (!machine) { setConnStatus(false, '执行机离线'); return; }
      setConnStatus(false, '正在读取终端会话…');
      try {
        if (machine.capabilities.includes('terminal.live.sessions')) {
          const { sessions } = await callMachine(machine.id, 'terminal.live.sessions', {});
          if (revision !== inventoryRevision) return;
          const running = sessions.filter(s => s.running);
          if (!running.length) {
            startHost.hidden = !machine.capabilities.includes('terminal.host.start');
            setConnStatus(false, '没有运行中的 Herdr 会话');
            return;
          }
          for (const session of running) sessionSelect.add(new Option(session.name, session.name));
          selectedSession = running.find(s => s.name === preferredSession)?.name || running.find(s => s.current)?.name
            || running.find(s => s.default)?.name || running[0].name;
          sessionSelect.value = selectedSession;
          sessionSelect.hidden = false;
        }
        const result = await callMachine(machine.id, 'terminal.live.list', {
          ...(selectedSession ? { session: selectedSession } : {}),
          ...(currentProject?.workspace ? { cwd: currentProject.workspace.cwd } : {}),
        });
        if (revision !== inventoryRevision) return;
        inventoryReady = true;
        panes = result.panes || [];
        selectedPane = panes.find(p => p.focused) || panes[0] || null;
        renderPaneList();
        switchMode(mode);
      } catch (error) {
        if (revision !== inventoryRevision) return;
        setConnStatus(false, error.message);
        if (!selectedSession) startHost.hidden = !machine.capabilities.includes('terminal.host.start');
      }
    }

    async function bootstrap() {
      const revision = ++inventoryRevision;
      try {
        const snap = await api('GET', '/state');
        if (revision !== inventoryRevision) return;
        currentProject = filterProjectId ? (snap.projects || []).find(p => p.id === filterProjectId && !p.archivedAt) : null;
        machines = (snap.machines || []).filter(m => m.online && (!filterProjectId || m.id === currentProject?.workspace?.machineId));
        machineSelect.replaceChildren(...machines.map(m => new Option(m.name, m.id)));
        machineSelect.hidden = machines.length < 2;
        const machine = machines.find(m => m.id === activeMachine?.id) || machines[0] || null;
        if (machine) machineSelect.value = machine.id;
        await loadMachine(machine, selectedSession);
      } catch (error) {
        if (revision === inventoryRevision) { stopAllModes(); setConnStatus(false, error.message); }
      }
    }

    machineSelect.onchange = () => void loadMachine(machines.find(m => m.id === machineSelect.value));
    sessionSelect.onchange = () => void loadMachine(activeMachine, sessionSelect.value);
    startHost.onclick = async () => {
      const machine = activeMachine;
      if (!machine || startHost.disabled) return;
      startHost.disabled = true;
      try {
        await callMachine(machine.id, 'terminal.host.start', {});
        if (machine === activeMachine) await loadMachine(machine);
      } catch (error) {
        if (machine === activeMachine) setConnStatus(false, error.message);
      } finally { startHost.disabled = false; }
    };

    // Events
    document.querySelectorAll('#mode-seg button').forEach(b => b.addEventListener('click', () => void switchMode(b.dataset.mode)));
    document.getElementById('pane-filter').addEventListener('input', renderPaneList);
    document.getElementById('btn-refresh').addEventListener('click', () => void bootstrap());
    document.getElementById('btn-files').addEventListener('click', (e) => {
      const sb = document.getElementById('files-sidebar');
      sb.hidden = !sb.hidden;
      e.target.classList.toggle('active', !sb.hidden);
      if (mode === 'full') triggerFullResize();
    });
    document.getElementById('btn-theme').addEventListener('click', () => {
      dark = !dark;
      document.getElementById('term-wrap').classList.toggle('dark', dark);
      const t = dark ? DARK_THEME : LIGHT_THEME;
      if (fullConn?.term) fullConn.term.options.theme = t;
      if (singleConn?.term) singleConn.term.options.theme = t;
      for (const c of multiConns) if (c.term) c.term.options.theme = t;
    });
    document.getElementById('btn-control').addEventListener('click', () => {
      if (!selectedPane) return;
      void startSingleMode(selectedPane, singleConn?.mode === 'control' ? 'observe' : 'control');
    });
    document.getElementById('btn-file-up').addEventListener('click', () => {
      if (!fileRelPath) return;
      const parts = fileRelPath.split('/'); parts.pop(); fileRelPath = parts.join('/');
      void loadFileTree();
    });
    document.getElementById('btn-git-diff').addEventListener('click', () => {
      if (!selectedFile) return;
      viewerShowingDiff = !viewerShowingDiff;
      void openFileViewer();
    });
    document.getElementById('viewer-mode').addEventListener('click', () => { viewerShowingDiff = !viewerShowingDiff; void openFileViewer(); });
    document.getElementById('viewer-close').addEventListener('click', () => { document.getElementById('file-viewer').hidden = true; });

    // Quick send bar works in both Full (WS) and Single modes
    function sendRaw(str) {
      const conn = mode === 'full' ? fullConn : singleConn;
      if (!conn?.ready || conn.mode === 'observe' || conn.ws.readyState !== WebSocket.OPEN) return false;
      conn.ws.send(JSON.stringify({ type: 'input', data: enc(str) }));
      return true;
    }
    document.getElementById('cmd-form').addEventListener('submit', e => {
      e.preventDefault();
      const input = document.getElementById('cmd-input');
      if (input.value && sendRaw(input.value + '\r')) input.value = '';
    });
    document.getElementById('btn-ctrlc').addEventListener('click', () => sendRaw('\x03'));

    let resizeTimer;
    function triggerFullResize() {
      clearTimeout(resizeTimer);
      resizeTimer = setTimeout(() => {
        if (mode !== 'full' || !fullConn?.ready || fullConn.ws.readyState !== WebSocket.OPEN) return;
        const { cols, rows } = calcColsRows(document.getElementById('full-term'));
        fullConn.term.resize(cols, rows);
        fullConn.ws.send(JSON.stringify({ type: 'resize', cols, rows }));
      }, 120);
    }

    async function syncFocus(conn) {
      if (!conn?.ready || conn.pendingFocus || document.hidden) return;
      conn.pendingFocus = true;
      try {
        const res = await callMachine(conn.machineId, 'terminal.live.list', conn.session ? { session: conn.session } : {});
        if (fullConn !== conn || !conn.ready) return;
        const focused = (res.panes || []).find(p => p.focused);
        selectedPane = focused || null;
        const cwd = currentProject?.workspace?.cwd;
        panes = (res.panes || []).filter(p => !cwd || p.cwd === cwd || p.cwd.startsWith(cwd.replace(/\/$/, '') + '/'));
        renderPaneList();
        setRoot(focused?.cwd || '');
        document.getElementById('top-sub').textContent = focused ? focused.title + ' · ' + focused.cwd : '';
      } catch (error) {
        if (fullConn === conn) { setRoot(''); document.getElementById('top-sub').textContent = error.message; }
      } finally { conn.pendingFocus = false; }
    }
    const focusTimer = setInterval(() => void syncFocus(fullConn), 2500);

    // Auto-takeover drawer
    let takeoverRev = 0;
    async function loadTakeover() {
      const rev = ++takeoverRev;
      const listEl = document.getElementById('takeover-list');
      try {
        const data = await api('GET', '/takeover');
        if (rev !== takeoverRev) return;
        document.getElementById('chk-takeover-enabled').checked = Boolean(data.settings?.enabled);
        document.getElementById('chk-takeover-trust').checked = Boolean(data.settings?.autoTrustBoundProjects);
        const items = data.items || [];
        listEl.innerHTML = items.length ? items.slice(0, 30).map(item => `
          <div class="pane-card" style="cursor:default;">
            <div class="pane-card-title">${esc(item.title || '')} · ${esc(item.paneTitle || '')}</div>
            <div class="pane-card-meta">${esc(item.status || '')} · ${esc((item.cwd || '').split('/').slice(-2).join('/'))}</div>
            ${item.actionNote ? `<div style="font-size:11.5px;color:var(--text-2);margin-top:4px;">${esc(item.actionNote)}</div>` : ''}
            ${item.status === 'open' ? `<div style="display:flex;gap:5px;flex-wrap:wrap;margin-top:6px;">
              ${(item.options || []).map(o => `<button class="btn" data-tk-key="${esc(item.key)}" data-tk-keys="${esc(o.keys)}" style="padding:3px 7px;font-size:11px;">${esc(o.label)}</button>`).join('')}
            </div>` : ''}
          </div>
        `).join('') : '<div style="padding:16px;color:var(--muted);text-align:center;">当前没有卡住的终端弹窗</div>';
        listEl.querySelectorAll('[data-tk-key]').forEach(btn => {
          btn.addEventListener('click', async () => {
            btn.disabled = true;
            try {
              await api('POST', '/takeover/answer', { key: btn.dataset.tkKey, keys: btn.dataset.tkKeys });
            } catch (err) {
              listEl.insertAdjacentHTML('afterbegin', `<div style="padding:8px;color:#b42318;font-size:12px;">操作失败：${esc(err.message || '未知错误')}</div>`);
            }
            void loadTakeover();
          });
        });
      } catch (err) {
        if (rev === takeoverRev) {
          listEl.innerHTML = `<div style="padding:16px;color:#b42318;text-align:center;">加载接管状态失败：${esc(err.message || '网络异常')}</div>`;
        }
      }
    }
    document.getElementById('btn-takeover').addEventListener('click', (e) => {
      const sb = document.getElementById('takeover-sidebar');
      sb.hidden = !sb.hidden;
      e.target.classList.toggle('active', !sb.hidden);
      if (!sb.hidden) void loadTakeover();
      triggerFullResize();
    });
    document.getElementById('btn-takeover-scan').addEventListener('click', async (e) => {
      const btn = e.currentTarget;
      btn.disabled = true;
      try {
        await api('POST', '/takeover/scan', {});
      } catch (err) {
        document.getElementById('takeover-list').innerHTML = `<div style="padding:16px;color:#b42318;text-align:center;">扫描失败：${esc(err.message || '未知错误')}</div>`;
      } finally {
        btn.disabled = false;
      }
      void loadTakeover();
    });
    for (const id of ['chk-takeover-enabled', 'chk-takeover-trust']) {
      document.getElementById(id).addEventListener('change', async (e) => {
        const el = e.currentTarget;
        try {
          await api('PUT', '/takeover', {
            enabled: document.getElementById('chk-takeover-enabled').checked,
            autoTrustBoundProjects: document.getElementById('chk-takeover-trust').checked,
          });
        } catch (err) {
          el.checked = !el.checked;
          document.getElementById('takeover-list').insertAdjacentHTML('afterbegin', `<div style="padding:8px;color:#b42318;font-size:12px;">保存配置失败：${esc(err.message || '未知错误')}</div>`);
        }
      });
    }
    window.addEventListener('resize', triggerFullResize);
    if (matchMedia('(max-width: 950px)').matches) {
      document.getElementById('files-sidebar').hidden = true;
      document.getElementById('btn-files').classList.remove('active');
    }
    window.addEventListener('pagehide', () => {
      clearInterval(focusTimer);
      clearTimeout(resizeTimer);
      stopAllModes();
    });
    void bootstrap();
  </script>
</body>
</html>
