<script>
// The theme is set before anything is drawn, so that the page does not flash the other one.
// This is the one setting that cannot wait for the modules to load.
(function () {
  try {
    var saved = JSON.parse(localStorage.getItem('sm.theme'));
    if (saved && saved.mode === 'dark') document.documentElement.dataset.theme = 'dark';
  } catch (e) { /* Without storage the workbench stays light. */ }
})();
</script>
